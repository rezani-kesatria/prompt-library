<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompt Library — design & dev prompts</title>
  <meta name="description" content="Browse and copy prompts for web design, mobile apps and animation — or build a comprehensive prompt with the mood-first builder." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Familjen+Grotesk:wght@400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=Gabarito:wght@400..800&family=Hanken+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..700&family=Syne:wght@400..800&family=Onest:wght@400..800&family=Archivo:wght@400..700&family=Schibsted+Grotesk:wght@400..800&family=Instrument+Sans:wght@400..700&family=Manrope:wght@400..800&family=Figtree:wght@400..800&family=Plus+Jakarta+Sans:wght@400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__row">
      <a class="brand" href="#" data-go="home" aria-label="Prompt Library home">
        <span class="marks"><span class="mark"></span><span class="mark mark--2"></span></span>
        <span class="brand__name">prompt.lib</span>
      </a>
      <nav class="nav">
        <a class="nav__link is-active" data-nav href="#" data-go="home">Home</a>
        <a class="nav__link" data-nav href="#" data-go="builder">Builder</a>
        <a class="nav__link" data-nav href="#" data-go="library">Library</a>
        <button class="circle-btn" id="theme-toggle" aria-label="Toggle light and dark theme"><span id="theme-thumb"></span></button>
      </nav>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section id="view-home" class="view is-active">
      <div class="container">
        <div class="hero">
          <span class="eyebrow" data-reveal>Prompt library — web · mobile · animation</span>
          <h1 data-reveal>Copy-ready prompts, or <span class="hero__accent">build one</span> from a look you love.</h1>
          <p data-reveal>Grab a single prompt and fill in the blanks — or run the mood-first builder to generate a comprehensive, theme-aware prompt kit.</p>
          <div class="hero__cta">
            <button class="btn btn--accent btn--lg" data-go="builder" data-reveal><span>Start the builder</span><span data-icon="arrow-right"></span></button>
            <button class="btn btn--lg" data-go="library" data-reveal><span>Browse the library</span></button>
          </div>
        </div>

        <div class="timeline" data-reveal>
          <div class="tl-line"></div>
          <div class="node"><span class="dot"></span></div>
          <div class="tl-line r"></div>
        </div>
      </div>
    </section>

    <!-- BUILDER -->
    <section id="view-builder" class="view">
      <div class="container">
        <div class="wiz-head">
          <span class="eyebrow">Design prompt builder</span>
          <div class="stepper" id="wiz-stepper"></div>
        </div>
        <div id="wiz-step"></div>
      </div>
    </section>

    <!-- LIBRARY -->
    <section id="view-library" class="view">
      <div class="container" id="lib-content"></div>
    </section>
  </main>

  <div class="toast" id="toast"><span data-icon="check"></span><span id="toast-msg">Copied</span></div>

  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/zdog@1.1.3/dist/zdog.dist.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
