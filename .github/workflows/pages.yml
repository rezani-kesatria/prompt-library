# Publishes the static Prompt Library app (app/) to GitHub Pages.
# The repo root keeps the 00–08 prompt markdown; only app/ is deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .nojekyll must survive into the artifact — without it Jekyll rewrites
      # the *.design-language.md spec files into HTML and every runtime
      # payload fetch 404s, silently gutting the generated prompts.
      - name: Verify .nojekyll is present
        run: test -f app/.nojekyll || (echo "::error::app/.nojekyll is missing" && exit 1)

      # enablement:true turns Pages on via the API if it is not already, so a
      # fresh clone of this repo deploys without a manual Settings step first
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4
