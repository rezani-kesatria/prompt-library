# Publishes the static Prompt Library app (app/) to GitHub Pages.
# The repo root keeps the 00–08 prompt markdown; only app/ is deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # v5 runs on node24; v4 is node20 and triggers the deprecation warning.
      # The Pages actions below are still node20 at their latest majors — that
      # is GitHub's choice, not ours, and there is no newer version to move to.
      - uses: actions/checkout@v5

      # .nojekyll must survive into the artifact — without it Jekyll rewrites
      # the *.design-language.md spec files into HTML and every runtime
      # payload fetch 404s, silently gutting the generated prompts.
      - name: Verify .nojekyll is present
        run: test -f app/.nojekyll || (echo "::error::app/.nojekyll is missing" && exit 1)

      # Pages must be enabled ONCE by hand: Settings -> Pages -> Source:
      # "GitHub Actions". enablement:true cannot do it — creating a Pages site
      # is an admin-scope call and GITHUB_TOKEN never has admin, so it fails
      # with "Resource not accessible by integration". Kept because it is a
      # no-op once the site exists and covers setups where the token is
      # granted more.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4
